[project]
name = "neuroint-brain"
version = "0.1.0"
description = "Gesture decision brain: gesture FSM -> action commands (no perception: landmarks come from the edge agent)"
requires-python = ">=3.11"
dependencies = [
    "neuroint-protocol",
    "websockets>=12.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["neuroint_brain*"]
