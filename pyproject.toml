[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import order
    "UP",      # modernization
    "B",       # bugbear
    "S",       # bandit: security smells (public repo hygiene)
    "C4",      # comprehensions
]
ignore = [
    "E501", # line length is handled by formatter where practical
]

[tool.ruff.format]
quote-style = "double"
